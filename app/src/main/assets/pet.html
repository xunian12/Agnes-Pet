<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agnes Pet</title>
<style>
html,body{width:100%;height:100%;min-height:100%;overflow:hidden;background:transparent;margin:0;padding:0}body{display:flex;justify-content:center;align-items:flex-end}
#pet-container{position:absolute;inset:0;width:100%;height:100%;display:flex;justify-content:center;align-items:flex-end}
#agnes-cat{display:block;width:150px;height:180px;max-width:90%;max-height:90%;cursor:pointer;transition:transform 0.2s ease;filter:none}
#bubble{position:absolute;top:8%;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.95);padding:8px 12px;border-radius:12px;font-size:12px;color:#2C3E50;opacity:0;transition:opacity 0.3s;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,0.1);max-width:100px;text-align:center}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.03)}}
@keyframes floaty{0%,100%{d:path("M 75 95 Q 95 85 90 70 Q 85 55 75 60")}50%{d:path("M 75 95 Q 100 90 95 75 Q 90 60 75 60")}}
.idle .body{animation:breathe 3s ease-in-out infinite}
.idle .sparkles{animation:floaty 3s ease-in-out infinite}
</style>
</head>
<body>
<div id="pet-container">
<svg id="agnes-cat" class="idle" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
<g class="sparkles">
<rect x="83" y="22" width="9" height="3" rx="1" fill="#FFC83D"/>
<rect x="86" y="19" width="3" height="9" rx="1" fill="#FFC83D"/>
<rect x="7" y="58" width="9" height="3" rx="1" fill="#FFC83D" opacity="0.5"/>
<rect x="10" y="55" width="3" height="9" rx="1" fill="#FFC83D" opacity="0.5"/>
</g>
<polygon points="24,38 18,16 40,34" fill="#E8867C"/>
<polygon points="76,38 82,16 60,34" fill="#E8867C"/>
<rect class="body" x="20" y="34" width="60" height="56" rx="12" fill="#EFA697"/>
<rect x="28" y="86" width="16" height="12" rx="4" fill="#E8867C"/>
<rect x="56" y="86" width="16" height="12" rx="4" fill="#E8867C"/>
<g class="eyes">
<rect x="37" y="50" width="7" height="16" rx="2" fill="#2C2C2C" class="pupil"/>
<rect x="56" y="50" width="7" height="16" rx="2" fill="#2C2C2C" class="pupil"/>
</g>
<g class="glasses">
<rect x="32" y="46" width="17" height="24" rx="4" fill="none" stroke="#4A6FA5" stroke-width="2"/>
<rect x="51" y="46" width="17" height="24" rx="4" fill="none" stroke="#4A6FA5" stroke-width="2"/>
<line x1="49" y1="57" x2="51" y2="57" stroke="#4A6FA5" stroke-width="2"/>
</g>
<path d="M 45 74 Q 50 78 55 74" fill="none" stroke="#2C2C2C" stroke-width="2" stroke-linecap="round" class="mouth"/>
<circle cx="31" cy="70" r="3" fill="#F5BFA8" opacity="0.7"/>
<circle cx="69" cy="70" r="3" fill="#F5BFA8" opacity="0.7"/>
</svg>
<div id="bubble"></div>
</div>
<script>
const cat=document.getElementById('agnes-cat');
const bubble=document.getElementById('bubble');
let bubbleTimer=null;
function showBubble(text){
  bubble.textContent=text;
  bubble.style.opacity='1';
  clearTimeout(bubbleTimer);
  bubbleTimer=setTimeout(()=>bubble.style.opacity='0',2200);
}
function animate(kind){
  cat.classList.remove('idle','happy','shy','angry','sleeping','jealous');
  cat.classList.add(kind);
  cat.style.transform=kind==='angry'?'rotate(-8deg) scale(1.08)':kind==='sleeping'?'scale(.94)':kind==='shy'?'scale(.96)': 'scale(1.1)';
  setTimeout(()=>{cat.classList.remove(kind);cat.classList.add('idle');cat.style.transform='scale(1)'},700);
}
window.agnesPet={
  onTap(){ animate('happy'); showBubble('喵~摸摸我'); },
  onDoubleTap(){ animate('shy'); showBubble('被你发现啦'); },
  onTripleTap(){ animate('jealous'); showBubble('不许停下'); },
  onLongPress(){ animate('angry'); showBubble('哼，再按我就生气啦'); }
};
cat.addEventListener('click',()=>{});
</script>
</body>
</html>
